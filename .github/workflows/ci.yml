name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.0"
      - name: Vet
        run: go vet ./...
      - name: Test (core)
        run: go test ./...
      - name: Test (rtkcompat)
        working-directory: rtkcompat
        run: go test ./...

  rtk-parity:
    runs-on: ubuntu-latest
    # Detects drift between upstream rtk's filter catalog and specs/rtk.json.
    # Non-blocking: rtk moves fast, so a drift here is a "time to re-sync"
    # signal, not a reason to block unrelated PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.0"
      - name: Check specs/rtk.json against upstream rtk
        working-directory: rtkcompat
        run: go run ./cmd/rtksync -check
